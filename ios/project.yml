name: PirateBrowser
options:
  bundleIdPrefix: com.thepiratebrowser
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    BUILD_CANARY: "local"
    PUTIO_CLIENT_ID: ""
targets:
  PirateBrowser:
    type: application
    platform: iOS
    sources:
      - path: PirateBrowser
    info:
      path: PirateBrowser/Info.plist
      properties:
        CFBundleDisplayName: Pirate Browser
        BuildCanary: "$(BUILD_CANARY)"
        PutIoClientId: "$(PUTIO_CLIENT_ID)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thepiratebrowser.ios
        PRODUCT_NAME: PirateBrowser
  PirateBrowserTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PirateBrowserTests
    dependencies:
      - target: PirateBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thepiratebrowser.ios.tests
schemes:
  PirateBrowser:
    build:
      targets:
        PirateBrowser: all
    test:
      config: Debug
      targets:
        - PirateBrowserTests
