name: Web app build

on:
  push:
    branches: [main]
    paths:
      - "web-app/**"
      - ".github/workflows/web-app-build.yml"
  pull_request:
    paths:
      - "web-app/**"
      - ".github/workflows/web-app-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Test and build frontend
        working-directory: web-app/frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Test and package backend
        working-directory: web-app/backend
        run: mvn --batch-mode verify
      - name: Build production container
        working-directory: web-app
        run: docker build -t pirate-browser-web:${{ github.sha }} .
      - uses: actions/upload-artifact@v4
        with:
          name: pirate-browser-web-${{ github.sha }}
          path: web-app/backend/target/pirate-browser-web-1.0.0-SNAPSHOT.jar
          if-no-files-found: error
