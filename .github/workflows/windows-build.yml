name: Build desktop and Android applications

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Maven, Windows portable, and Android APK
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test with Maven
        shell: pwsh
        run: mvn --batch-mode clean package

      - name: Build and smoke-test portable application
        shell: pwsh
        env:
          PUTIO_CLIENT_ID: ${{ vars.PUTIO_CLIENT_ID }}
        run: ./packaging/windows/build-portable.ps1

      - name: Build Android debug APK
        shell: pwsh
        working-directory: android
        env:
          PUTIO_CLIENT_ID: ${{ vars.PUTIO_CLIENT_ID }}
        run: ./gradlew.bat --no-daemon assembleDebug

      - name: Collect Android APK
        shell: pwsh
        run: |
          $apks = @(Get-ChildItem `
            -LiteralPath "android/app/build/outputs/apk/debug" `
            -Filter "*.apk" `
            -File)
          if ($apks.Count -ne 1) {
            throw "Expected exactly one debug APK, found $($apks.Count)."
          }
          Copy-Item `
            -LiteralPath $apks[0].FullName `
            -Destination "target/PirateBrowser-android-debug.apk"

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $artifacts = @(
            "target/PirateBrowser-windows-x64-portable.zip",
            "target/PirateBrowser-android-debug.apk"
          )
          foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $artifact)" |
              Set-Content -LiteralPath "$artifact.sha256" -Encoding ascii
          }

      - name: Upload downloadable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PirateBrowser-windows-x64
          path: |
            target/PirateBrowser-windows-x64-portable.zip
            target/PirateBrowser-windows-x64-portable.zip.sha256
          if-no-files-found: error

      - name: Upload downloadable Android build
        uses: actions/upload-artifact@v4
        with:
          name: PirateBrowser-android-debug
          path: |
            target/PirateBrowser-android-debug.apk
            target/PirateBrowser-android-debug.apk.sha256
          if-no-files-found: error

      - name: Publish latest builds Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release delete latest `
              --repo "${{ github.repository }}" `
              --cleanup-tag `
              --yes
            if ($LASTEXITCODE -ne 0) {
              throw "Could not replace the previous latest Release."
            }
          }

          $shortSha = "${{ github.sha }}".Substring(0, 7)
          gh release create latest `
            "target/PirateBrowser-windows-x64-portable.zip" `
            "target/PirateBrowser-windows-x64-portable.zip.sha256" `
            "target/PirateBrowser-android-debug.apk" `
            "target/PirateBrowser-android-debug.apk.sha256" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "Latest builds" `
            --notes "Automatic Windows and Android builds from main commit $shortSha." `
            --latest
          if ($LASTEXITCODE -ne 0) {
            throw "Could not publish the latest Release."
          }

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "target/PirateBrowser-windows-x64-portable.zip" `
            "target/PirateBrowser-windows-x64-portable.zip.sha256" `
            "target/PirateBrowser-android-debug.apk" `
            "target/PirateBrowser-android-debug.apk.sha256" `
            --repo "${{ github.repository }}" `
            --title "Pirate Browser ${{ github.ref_name }}" `
            --generate-notes
