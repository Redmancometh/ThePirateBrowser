name: Build Windows application

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Maven test and Windows portable build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test with Maven
        shell: pwsh
        run: mvn --batch-mode clean package

      - name: Build and smoke-test portable application
        shell: pwsh
        run: ./packaging/windows/build-portable.ps1

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $archive = "target/ThePirateBrowser-windows-x64-portable.zip"
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ThePirateBrowser-windows-x64-portable.zip" |
            Set-Content -LiteralPath "$archive.sha256" -Encoding ascii

      - name: Upload downloadable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ThePirateBrowser-windows-x64
          path: |
            target/ThePirateBrowser-windows-x64-portable.zip
            target/ThePirateBrowser-windows-x64-portable.zip.sha256
          if-no-files-found: error

      - name: Publish latest build Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release delete latest `
              --repo "${{ github.repository }}" `
              --cleanup-tag `
              --yes
            if ($LASTEXITCODE -ne 0) {
              throw "Could not replace the previous latest Release."
            }
          }

          $shortSha = "${{ github.sha }}".Substring(0, 7)
          gh release create latest `
            "target/ThePirateBrowser-windows-x64-portable.zip" `
            "target/ThePirateBrowser-windows-x64-portable.zip.sha256" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "Latest Windows build" `
            --notes "Automatic Windows build from main commit $shortSha." `
            --latest
          if ($LASTEXITCODE -ne 0) {
            throw "Could not publish the latest Release."
          }

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "target/ThePirateBrowser-windows-x64-portable.zip" `
            "target/ThePirateBrowser-windows-x64-portable.zip.sha256" `
            --repo "${{ github.repository }}" `
            --title "The Pirate Browser ${{ github.ref_name }}" `
            --generate-notes
