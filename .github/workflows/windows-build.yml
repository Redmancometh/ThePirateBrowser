name: Build Windows application

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Maven test and Windows portable build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test with Maven
        shell: pwsh
        run: mvn --batch-mode clean package

      - name: Build and smoke-test portable application
        shell: pwsh
        run: ./packaging/windows/build-portable.ps1

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $archive = "target/ThePirateBrowser-windows-x64-portable.zip"
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ThePirateBrowser-windows-x64-portable.zip" |
            Set-Content -LiteralPath "$archive.sha256" -Encoding ascii

      - name: Upload downloadable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ThePirateBrowser-windows-x64
          path: |
            target/ThePirateBrowser-windows-x64-portable.zip
            target/ThePirateBrowser-windows-x64-portable.zip.sha256
          if-no-files-found: error

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "target/ThePirateBrowser-windows-x64-portable.zip" `
            "target/ThePirateBrowser-windows-x64-portable.zip.sha256" `
            --repo "${{ github.repository }}" `
            --title "The Pirate Browser ${{ github.ref_name }}" `
            --generate-notes
