services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pirate_browser
      POSTGRES_USER: pirate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pirate-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pirate -d pirate_browser"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/pirate_browser
      DATABASE_USERNAME: pirate
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PUTIO_OAUTH_TOKEN: ${PUTIO_OAUTH_TOKEN:?Set PUTIO_OAUTH_TOKEN}
      WEB_ADMIN_USERNAME: ${WEB_ADMIN_USERNAME:?Set WEB_ADMIN_USERNAME}
      WEB_ADMIN_PASSWORD: ${WEB_ADMIN_PASSWORD:?Set WEB_ADMIN_PASSWORD}
      WEB_REGISTRATION_INVITE_CODE: ${WEB_REGISTRATION_INVITE_CODE:-}
      BUILD_CANARY: ${BUILD_CANARY:-WEB-LOCAL}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

volumes:
  pirate-postgres:
